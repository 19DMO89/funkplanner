/* ===== Anpassen für die eigene Webseite ===== */
const CONFIG={

  org:'Smart Dome Solutions e.U.',

  homeUrl:'/',            // Klick auf Logo/Titel führt hierhin ('' = kein Link)
  version:'2026-10-02',
  storageKey:'funkplaner-v2',

};
/* ============================================ */

/* ===== Gerätedatenbank =====
   Eigene Geräte einfach ergänzen. Quelle (src):
   'ds'  = laut Datenblatt des Herstellers
   'chip'= Maximalwert des verbauten Funkchips
   'eu'  = EU-Grenzwert (EIRP)

    if(!excl) continue; const e=byId(excl); if(e&&e.net==='wf'&&e.type==='ap'&&!overlaps24(+a.ch24||1,+e.ch24||1)) continue;

  const maxPx=1600, k=Math.min(1,maxPx/Math.max(im.naturalWidth,im.naturalHeight));

function attachSearch(input,list,opts){
  let items=[],idx=-1;
  const close=()=>{list.hidden=true;idx=-1;};
  const show=()=>{
    items=searchDB(input.value,opts.net&&opts.net());
    if(!input.value.trim()){close();return;}
    list.innerHTML=items.length?items.map((e,i)=>`<li data-i="${i}" aria-selected="${i===idx}"><span class="dot" style="background:var(--${e.role==='coord'?'coord':e.net})"></span><span class="n">${esc(e.n)}</span><span class="v">${esc(dbValue(e))}</span><span class="m">${esc(e.b)} · ${esc(NETS[e.net].name)}-${esc(NETS[e.net].roles[e.role])}${e.note?', '+esc(e.note):''}</span></li>`).join('')
      :`<li class="empty">Nicht in der Datenbank. Setz ein Gerät mit der passenden Rolle und trag die Werte selbst ein.</li>`;
    list.hidden=false;
  };
  const pick=i=>{const e=items[i]; if(!e) return; close(); input.value=''; opts.onPick(e);};
  input.addEventListener('input',()=>{idx=-1;show();});
  input.addEventListener('focus',show);
  input.addEventListener('keydown',ev=>{
    if(ev.key==='ArrowDown'){ev.preventDefault();idx=Math.min(items.length-1,idx+1);show();}
    else if(ev.key==='ArrowUp'){ev.preventDefault();idx=Math.max(0,idx-1);show();}
    else if(ev.key==='Enter'){ev.preventDefault();pick(idx<0?0:idx);}
    else if(ev.key==='Escape'){close();input.blur();}
  });
  list.addEventListener('mousedown',ev=>{const li=ev.target.closest('[data-i]'); if(li){ev.preventDefault();pick(+li.dataset.i);}});
  input.addEventListener('blur',()=>setTimeout(close,120));
}

function devStatus(d){
  if(d.type==='noise'){}

  }

    if(d.type==='proxy') return {cls:'good',t:`Empfängt ${a.clients} ${a.clients===1?'Gerät':'Geräte'} am besten. Weitere Proxys verbessern Reichweite und Präsenzerkennung.`};
    if(!an.hasRoot) return {cls:'bad',t:'Platziere zuerst einen Bluetooth-Proxy oder -Adapter.'};
    const p=byId(a.parent);
    if(!a.ok) return {cls:'bad',t:`Kein Proxy empfängt das Gerät zuverlässig.${p?` Am besten noch ${esc(p.name)} mit ${fmt(a.rssi)}.`:''} Ein ESP32-Proxy in der Nähe löst das meist.`};
    return {cls:a.rssi>=-80?'good':'warn',t:`Empfangen von ${esc(p.name)}${p.floor!==d.floor?' ('+esc(floorName(p.floor))+')':''} mit ${fmt(a.rssi)}${a.heard>1?` – insgesamt hören ${a.heard} Proxys mit.`:'.'}`};
  }
  if(d.net==='wf'){
    if(d.type==='ap') return {cls:'good',t:`Versorgt ${a.clients} ${a.clients===1?'Client':'Clients'} im Plan. Backhaul per Kabel angenommen.`+(d.outdoor?' Außengerät'+(d.ant==='dir'?` mit Richtantenne nach ${Math.round(+d.az||0)}°.`:', Rundstrahler.'):'')};
    if(!an.hasRoot) return {cls:'bad',t:'Platziere zuerst einen Access Point.'};
    if(!a.parent) return {cls:'bad',t:`Kein Access Point sendet auf ${BAND_LABEL[a.band]}.`};
    const p=byId(a.parent);
    return {cls:a.ok?(a.rssi>=-67?'good':'warn'):'bad',t:`Bester Access Point auf ${BAND_LABEL[a.band]}: ${esc(p.name)}${p.floor!==d.floor?' ('+esc(floorName(p.floor))+')':''} mit ${fmt(a.rssi)} – ${quality(a.rssi,a.band)}, schätzungsweise ${rateFor(a.rssi,a.band)}.`};
  }

  if(a.root){
    if(d.net==='sg'){const n=an.roots;return n>1?{cls:'good',t:`Eine von ${n} Zentralen im Plan.`}:{cls:'good',t:'Zentrale des 868-MHz-Netzes. Alle Wege führen hierher.'};}

    return {cls:'good',t:'Koordinator des Netzes. Alle Wege führen hierher.'};
  }
  if(!an.hasRoot) return {cls:'bad',t:`Platziere zuerst einen ${rootName}.`};
  if(a.ok){const p=byId(a.parent);
    const wk2=d.net==='sg'?-95:-85;

}

    case 'lanPoe': if(d) d.poeW=Math.max(0,num(t.value,0)); break;
    case 'camAz': if(d) d.az=((num(t.value,0)%360)+360)%360; break;
    case 'camFov': if(d) d.fov=Math.max(5,Math.min(360,num(t.value,90))); break;
    case 'camRange': if(d) d.range=Math.max(1,num(t.value,20)); break;
    case 'cable': {const l=sel&&sel.kind==='link'&&S.links.find(x=>x.id===sel.id); if(l) l.cable=t.value; break;}
    case 'lanRes': S.settings.lan.res=Math.max(0,num(t.value,1.5)); break;
    case 'lanCable': S.settings.lan.cable=t.value; break;
    case 'projName': {const e0=PROJ.list.find(x=>x.id===PROJ.current),v=t.value.trim(); if(e0&&v){e0.name=v;writeIdx();renderProjects();} break;}
    case 'devType': if(d){d.type=t.value; if(d.net==='wf'){Object.assign(d,makeDevice(d.type,d.x,d.y),{id:d.id,name:d.name,floor:d.floor});} else if(d.net==='lan') Object.assign(d,LAN_DEFAULTS[d.type]||{}); else d.tx=NETS[d.net].tx[d.type];} break;
    case 'devTx': if(d){d.tx=num(t.value,d.tx); d.src='own';} break;
    case 'apBand': if(d) d.bands[t.dataset.b]=t.checked; break;
    case 'apTx': if(d){d.txb[t.dataset.b]=num(t.value,d.txb[t.dataset.b]); d.src='own';} break;
    case 'apCh': if(d) d.ch24=+t.value; break;
    case 'apOut': if(d){d.outdoor=t.checked; if(t.checked&&d.bands.b6){d.bands.b6=false; toast('6 GHz deaktiviert – im Freien ist das Band in der EU nicht zulässig.');}} break;
    case 'apAnt': if(d){d.ant=t.value; if(t.value==='dir'&&(!d.bw||d.bw>=360)) d.bw=90; if(t.value==='omni') d.bw=360;} break;
    case 'apAz': if(d) d.az=((num(t.value,0)%360)+360)%360; break;

    case 'sgEnd': s.sg.endTx=num(t.value,5); break;
    case 'btThr': s.bt.thr=num(t.value,-90); break;
    case 'btEnd': s.bt.endTx=num(t.value,0); break;
    case 'devH': if(d) d.h=Math.max(0,num(t.value,1)); break;
    case 'nType': if(d){d.ntype=t.value; const n0=NOISE_TYPES[t.value]; if(n0){d.p=n0.p; d.bands={...n0.bands};}} break;
    case 'nP': if(d) d.p=num(t.value,0); break;

    case 'cBand': if(d) d.cband=t.value; break;

    case 'slabCm': f.slabSpec.cm=Math.max(0,num(t.value,20)); f.slab=slabFromSpec(f.slabSpec,f.slab); break;
    case 'slabAufbau': f.slabSpec.aufbau=t.value; f.slab=slabFromSpec(f.slabSpec,f.slab); break;
    case 'flW': {const nw=num(t.value,f.imgW); if(nw>0) applyScale(nw/f.imgW,true); break;}

    case 'zbCh': s.zb.ch=+t.value; break;

function transformFloor(fid,sc,th,tx,ty){
  const c=Math.cos(th)*sc,sn=Math.sin(th)*sc,T=(x,y)=>[c*x-sn*y+tx,sn*x+c*y+ty];
  const f=S.floors.find(x=>x.id===fid);
  {const [x,y]=T(f.imgX,f.imgY);f.imgX=x;f.imgY=y;f.imgW*=sc;f.imgRot=(f.imgRot||0)+th;}
  S.walls.forEach(w=>{if(w.floor!==fid)return;[w.x1,w.y1]=T(w.x1,w.y1);[w.x2,w.y2]=T(w.x2,w.y2);});
  S.devices.forEach(d=>{if(d.floor!==fid)return;[d.x,d.y]=T(d.x,d.y);});
  if(f.refs) Object.values(f.refs).forEach(r=>{[r.x,r.y]=T(r.x,r.y);});
}
function fitSimilarity(P,Q){ // P -> Q, Drehung + Maßstab + Verschiebung (kleinste Quadrate)
  const n=P.length,mp=[0,0],mq=[0,0]; P.forEach((p,i)=>{mp[0]+=p[0]/n;mp[1]+=p[1]/n;mq[0]+=Q[i][0]/n;mq[1]+=Q[i][1]/n;});
  let a=0,b=0,nn=0; P.forEach((p,i)=>{const px=p[0]-mp[0],py=p[1]-mp[1],qx=Q[i][0]-mq[0],qy=Q[i][1]-mq[1];a+=px*qx+py*qy;b+=px*qy-py*qx;nn+=px*px+py*py;});
  if(nn<1e-9) return null;
  const sc=Math.hypot(a,b)/nn, th=Math.atan2(b,a), c=Math.cos(th)*sc, sn=Math.sin(th)*sc;
  return {sc,th,tx:mq[0]-(c*mp[0]-sn*mp[1]),ty:mq[1]-(sn*mp[0]+c*mp[1])};
}
function alignFloor(fid,keepScale){
  const f=S.floors.find(x=>x.id===fid), rf=S.floors.find(x=>x.id===S.alignRef);
  if(!f||!rf||f===rf) return {err:'Wähl ein anderes Bezugsgeschoss.'};
  const keys=['A','B','C'].filter(k=>f.refs&&f.refs[k]&&rf.refs&&rf.refs[k]);
  if(keys.length<2) return {err:`${f.name}: Es braucht mindestens zwei Punkte, die auf beiden Geschossen gesetzt sind.`};
  const P=keys.map(k=>[f.refs[k].x,f.refs[k].y]), Q=keys.map(k=>[rf.refs[k].x,rf.refs[k].y]);
  let t=fitSimilarity(P,Q); if(!t) return {err:'Die Punkte liegen zu nah beieinander.'};
  if(keepScale){ // nur drehen und verschieben
    const n=P.length,mp=[0,0],mq=[0,0];P.forEach((p,i)=>{mp[0]+=p[0]/n;mp[1]+=p[1]/n;mq[0]+=Q[i][0]/n;mq[1]+=Q[i][1]/n;});
    const c=Math.cos(t.th),sn=Math.sin(t.th); t={sc:1,th:t.th,tx:mq[0]-(c*mp[0]-sn*mp[1]),ty:mq[1]-(sn*mp[0]+c*mp[1])};
  }
  transformFloor(fid,t.sc,t.th,t.tx,t.ty);
  const err=Math.sqrt(keys.reduce((s,k)=>s+(f.refs[k].x-rf.refs[k].x)**2+(f.refs[k].y-rf.refs[k].y)**2,0)/keys.length);
  return {err:null,rms:err,sc:t.sc,deg:t.th*180/Math.PI};
}
function applyScale(k,noSnap){
  if(!(k>0)||!isFinite(k)) return; if(!noSnap) snap();
  const f=floor(), ox=IMG[cur]?f.imgX:0, oy=IMG[cur]?f.imgY:0;
  f.imgW*=k;
  S.walls.forEach(w=>{if(w.floor!==cur)return;w.x1=ox+(w.x1-ox)*k;w.y1=oy+(w.y1-oy)*k;w.x2=ox+(w.x2-ox)*k;w.y2=oy+(w.y2-oy)*k;});
  S.devices.forEach(d=>{if(d.floor!==cur)return;d.x=ox+(d.x-ox)*k;d.y=oy+(d.y-oy)*k;});
  if(f.refs) Object.values(f.refs).forEach(r=>{r.x=ox+(r.x-ox)*k;r.y=oy+(r.y-oy)*k;});
  changed(); fit();
}
$('#imgFile').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const rd=new FileReader(); rd.onload=()=>{const im=new Image(); im.onload=()=>{
    const max=2400,k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    snap(); IMG[cur]=c.toDataURL('image/jpeg',0.82); delete imgCache[cur]; changed(); renderPanel(); setTimeout(fit,60);
    toast('Grundriss geladen. Zieh jetzt mit „Maßstab“ eine Linie über eine bekannte Strecke.');
  }; im.src=rd.result;}; rd.readAsDataURL(file); e.target.value='';
});

/* ---------- Export / Import ---------- */
function modal(title,text,value,btns,ro){$('#mTitle').textContent=title;$('#mText').textContent=text;const ta=$('#mArea');ta.value=value;ta.readOnly=!!ro;$('#mBtns').innerHTML='';
  btns.forEach(([l,cls,fn])=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=l;b.onclick=fn;$('#mBtns').appendChild(b);});$('#modal').hidden=false;setTimeout(()=>ta.focus(),20);}
const closeModal=()=>{$('#modal').hidden=true;};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function projectText(){return JSON.stringify({app:'funkplaner',version:2,name:projName(PROJ.current),state:S,images:IMG});}
function openExport(){
  const txt=projectText();
  modal('Projekt exportieren','Speichere den Plan als Datei oder kopiere den Text. Grundriss-Bilder sind enthalten.',txt,[
    ['Als Datei speichern','primary',()=>{try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=(projName(PROJ.current).replace(/[^\wäöüÄÖÜß -]/g,'').trim()||'funkplan')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}catch(e){toast('Speichern als Datei ist hier nicht möglich – nutze „Kopieren“.');}}],
    ['Kopieren','',async()=>{try{await navigator.clipboard.writeText(txt);toast('In die Zwischenablage kopiert.');}catch(e){$('#mArea').select();toast('Text ist markiert – mit Strg+C kopieren.');}}],
    ['Schließen','',closeModal]],true);
}
function importText(txt,asNew){
  try{const o=JSON.parse(txt);const s=migrate(o.state);if(!s) throw 0;
    if(asNew){saveNow();newProject(o.name||'Importiertes Projekt',s,o.images||{});closeModal();openProjectFresh();toast('Als neues Projekt importiert.');return;}
    snap();S=s;IMG=o.images||{};imgCache={};cur=S.floors[0].id;sel=null;renderMatSelect();changed();renderPanel();closeModal();fit();toast('Projekt importiert.');}
  catch(e){toast('Das ist kein gültiger Projekttext. Prüf, ob der ganze Inhalt eingefügt wurde.');}
}
function openImport(){
  modal('Projekt importieren','Wähl eine gespeicherte funkplan.json oder füge den Projekttext ein.','',[
    ['Datei wählen','',()=>$('#jsonFile').click()],
    ['Als neues Projekt','primary',()=>importText($('#mArea').value,true)],
    ['Aktuelles ersetzen','',()=>importText($('#mArea').value,false)],
    ['Abbrechen','',closeModal]]);
}
$('#jsonFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result,true);r.readAsText(f);e.target.value='';});
